spring:
  datasource:
    url: jdbc:mysql://mysql:3306/stock_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: stock_scheduler
    password: ${SCHEDULER_DB_PASSWORD}
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: nacos:8848

aistock:
  user:
    url: ${USER_SERVICE_URL:http://stock-user-service:8080}
  alert:
    market-url: ${ALERT_MARKET_URL:http://stock-market-service:8080}
    notification-url: ${ALERT_NOTIFICATION_URL:http://stock-notification-service:8080}
