server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    error_page 502 504 =503 @gateway_unavailable;
    location @gateway_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"code":"GATEWAY_UNAVAILABLE","message":"服务暂不可用，请稍后重试","data":null,"traceId":"$request_id"}';
    }
    location ~ ^/api/v1/portfolio-analyses(?:/|$) {
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 60s;
        proxy_pass http://stock-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/api/v1/(?:predictions|stock-analyses|stock-questions|portfolio-questions|comparison-explanations)(?:/|$) {
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 190s;
        proxy_pass http://stock-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/api/v1/admin/models/[0-9a-f-]+/holdout-comparison$ {
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 22s;
        proxy_pass http://stock-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 8s;
        proxy_pass http://stock-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /internal/ { return 404; }
    # Missing deployment chunks must be 404, never the SPA HTML entry.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html { add_header Cache-Control no-store always; }
    location / {
        add_header Cache-Control no-store always;
        try_files $uri $uri/ /index.html;
    }
}
